[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "docchat-shelbytang"
version = "0.2.0"
readme = "README.md"
dependencies = ["groq", "python-dotenv"]

[project.scripts]
chat = "chat:repl"

[tool.setuptools]
py-modules = ["chat"]
packages = ["tools"]
